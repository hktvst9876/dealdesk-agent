# The capacity-allocation test from Build Spec v2 (first demo).
# One room, four hours, S$590 offered, S$160 to serve.

business:
  id: karaoke
  name: Karaoke Demo
  kind: karaoke
  currency: SGD
  currency_symbol: "S$"
  timezone: Asia/Singapore
  staffed_hours: { daily: "12:00-02:00" }
  late_close: "23:59"

sessions:
  - { id: sat_eve_1, type: sat_peak,      days: [sat], start: "19:00", end: "21:00" }
  - { id: sat_eve_2, type: sat_peak,      days: [sat], start: "21:00", end: "23:00" }
  - { id: sun_aft_1, type: sun_afternoon, days: [sun], start: "14:00", end: "16:00" }
  - { id: sun_aft_2, type: sun_afternoon, days: [sun], start: "16:00", end: "18:00" }

inventory:
  - id: karaoke_room
    label: private room
    aliases: [rooms, room]
    units: 2
    unit_ids: ["Room A", "Room B"]
    guests_per_unit: 20
    pricing: fixed
    prices: { sat_peak: 380, sun_afternoon: 180 }
    cost_to_serve: { per_hour: 40 }
    regular:
      mode: chance
      contribution: { sat_peak: 300, sun_afternoon: 150 }
      chance: { sat_eve_1: 0.9, sat_eve_2: 0.8, sun_aft_1: 0.5, sun_aft_2: 0.5 }

economics:
  cogs_pct: 0
  service_cost_per_guest: 0

perks:
  - id: cake
    label: Birthday cake
    type: item
    cost: 25
    displaced_margin: 10
    eligibility: { occasions: [birthday] }
    approval: front_line
    blockers: [occasion]
    customer_text: "a birthday cake on the house"

policy:
  min_contribution: 100
  concession_cap: 150
  authority: { front_line: 100, manager: 300 }
