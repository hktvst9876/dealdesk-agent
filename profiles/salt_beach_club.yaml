# Salt Beach Club: the Build Spec v2 reference business.
# Every value marked "estimate" or listed under placeholders must be replaced
# with the venue's real numbers before the agent goes live.

business:
  id: salt
  name: Salt Beach Club
  kind: beach_club
  currency: SGD
  currency_symbol: "S$"
  timezone: Asia/Singapore
  reply_sla: { staffed_minutes: 15, out_of_hours_minutes: 60 }
  staffed_hours: { sat_sun: "09:00-22:00", mon_fri: "10:00-22:00" }
  desk_hours: { sat_sun: "09:00-20:00", mon_fri: "10:00-18:00" }   # reservations desk (placeholder)
  online_cap_guests: 8
  booking_url: "https://www.sevenrooms.com/reservations/salt"        # placeholder
  paylink_url: "https://pay.example.com/salt"                         # placeholder: the venue's own paylink
  late_close: "22:00"
  tone: >-
    Warm, specific, short. Lead with the plan for their group, then the number,
    then the one next step. Use the customer's words for the occasion. Singlish is
    fine to receive and not required to send.
  house_rules:
    wet_weather: "If it rains we move your group indoors at no charge, subject to indoor availability, and no-show fees are waived in wet weather."
    pool: "The pool closes to groups after 15:00."
    card_on_file: "We confirm with a card on file. It is only charged for a no-show: S$100 per bed, S$50 for dining."
    cancellation: "Free cancellation up to 48 hours before your booking."   # placeholder
    minimum_spend: "The minimum spend goes entirely toward food and drinks on the day."
    layout: "Beds and the bean bag section sit side by side on the beachfront, so a group of up to 26 stays together."

sessions:
  - { id: weekday,     type: weekday,     days: [mon_fri], start: "10:00", end: "22:00" }
  - { id: weekend_am,  type: weekend_am,  days: [sat_sun], start: "09:00", end: "13:00" }
  - { id: weekend_pm,  type: weekend_pm,  days: [sat_sun], start: "13:00", end: "17:00" }
  - { id: weekend_eve, type: weekend_eve, days: [sat_sun], start: "17:00", end: "late" }

inventory:
  - id: beachfront_bed
    label: beachfront bed
    units: 8                       # estimate: replace with actual
    estimate: true
    guests_per_unit: 6
    outdoor: true
    pricing: minimum_spend
    floors: { weekday: 80, weekend_am: 200, weekend_pm: 250, weekend_eve: 150 }
    regular:
      mode: matrix
      # Placeholder: chosen so the spec's footprint (3 beds + bean bags, Sunday eve,
      # P(resell) 0.6) gives the S$276 resale fallback. Replace from POS history.
      contribution: { weekday: 50, weekend_am: 140, weekend_pm: 175, weekend_eve: 115 }
      forecast_utilisation: { weekday: 0.35, weekend_am: 0.6, weekend_pm: 0.75, weekend_eve: 0.5 }
  - id: beanbag_section
    label: bean bag section
    units: 1
    guests_per_unit: 8
    outdoor: true
    pricing: minimum_spend
    floors: { weekday: 80, weekend_am: 200, weekend_pm: 250, weekend_eve: 150 }
    regular:
      mode: matrix
      contribution: { weekday: 50, weekend_am: 140, weekend_pm: 175, weekend_eve: 115 }
      forecast_utilisation: { weekday: 0.35, weekend_am: 0.6, weekend_pm: 0.75, weekend_eve: 0.5 }
  - id: vip_area
    label: VIP area
    units: 1
    guests_per_unit: 20
    pricing: minimum_spend
    floors: { weekday: 1500, weekend_am: 1500, weekend_pm: 1500, weekend_eve: 1500 }
    regular:
      mode: matrix
      # Inferred, not given: a VIP opportunity cost of ~S$302.50 is the only value that
      # reproduces both printed VIP figures (E S$509, break-even 24.7%). Confirm in the workbook.
      contribution: { weekday: 400, weekend_am: 550, weekend_pm: 550, weekend_eve: 550 }
      chance: { weekend_eve: 0.55 }
      forecast_utilisation: { weekend_eve: 0.5 }

economics:
  cogs_pct: 0.30                     # placeholder from the workbook
  service_cost_per_guest: 4
  spend_per_guest: { base: 55, conservative: 45 }
  byo_displaced_margin_per_bottle: 20
  future_value: { enabled: false }

fees:
  corkage_wine: { amount: 50, per: bottle, label: corkage }

perks:
  - id: cake
    label: Birthday cake
    type: item
    cost: 25
    displaced_margin: 10
    availability: kitchen_checklist
    stock_key: cakes
    eligibility: { occasions: [birthday, anniversary], min_guests: 6 }
    max_per_booking: 1
    approval: front_line
    blockers: [occasion, price]
    p_class: perk
    customer_text: "a birthday cake on the house"
    condition: "order by 12:00 on the day"
  - id: welcome_drink
    label: Welcome drink, house pour
    type: item
    cost: 14
    cost_per: guest
    availability: bar_stock
    eligibility: { min_guests: 8 }
    max_per_booking: 10
    # Spec said front line to 10 (S$140), which exceeds front-line authority (S$100).
    approval: { front_line: 7, manager: 10 }
    blockers: [occasion, price]
    p_class: perk
    customer_text: "a welcome drink (house pour) each"
  - id: corkage_waiver
    label: Corkage waiver
    type: fee_waiver
    fee_id: corkage_wine
    eligibility: { min_guests: 10, or_occasion: true, occasions: [birthday, anniversary, celebration] }
    max_per_booking: 4
    approval: { front_line: 1, manager: 4 }
    blockers: [fee]
    p_class: fee_concession
    customer_text: "corkage waived on one bottle"
  - id: floor_discount
    label: 15% off the minimum spend
    type: price_discount
    discount_pct: 0.15
    eligibility: { max_lead_time_hours: 48, max_utilisation: 0.60, lead_or_utilisation: true }
    max_per_booking: 1
    approval: front_line
    blockers: [price]
    p_class: price
    customer_text: "15% off the minimum spend"
  - id: vip_group_rate
    label: VIP area group package
    type: package
    resource_id: vip_area
    floor: 1200
    availability: vip_unbooked
    eligibility: { min_guests: 12 }
    max_per_booking: 1
    approval: front_line
    blockers: [fit, occasion, risk]
    p_class: alternative
    customer_text: "the private VIP area for your group at a S$1,200 minimum spend, all toward food and drinks"
  - id: vip_upgrade_bed_tier
    label: VIP upgrade at bed-tier floor
    type: package
    resource_id: vip_area
    floor_basis: requested
    availability: vip_unbooked
    eligibility: { min_guests: 12 }
    max_per_booking: 1
    approval: manager
    blockers: [fit, occasion]
    p_class: perk
    customer_text: "an upgrade to the private VIP area at the same minimum spend"
  - id: prosecco
    label: Complimentary prosecco
    type: item
    cost: 68
    availability: bar_stock
    eligibility: { occasions: [birthday, anniversary, celebration], min_guests: 10 }
    max_per_booking: 1
    approval: manager
    blockers: [occasion]
    p_class: perk
    customer_text: "a bottle of prosecco on the house"
  - id: session_extension
    label: Session extension +1h
    type: extension
    cost: 15
    extra_hours: 1
    availability: next_session_unsold
    max_per_booking: 1
    approval: front_line
    blockers: [timing]
    p_class: perk
    customer_text: "an extra hour at no charge"
  - id: wet_weather_hold
    label: Indoor wet-weather hold
    type: terms
    cost: 40
    availability: indoor_availability
    eligibility: { outdoor_only: true, min_guests: 10 }
    max_per_booking: 1
    approval: front_line
    blockers: [risk]
    p_class: terms
    customer_text: "an indoor space held for you in case of rain"
  - id: deposit_instead_of_card
    label: Deposit instead of card-on-file
    type: terms
    cost: 0
    max_per_booking: 1
    approval: front_line
    blockers: [process, risk]
    p_class: terms
    customer_text: "a deposit instead of a card on file, if you prefer"

policy:
  min_contribution: 400
  concession_cap: 150
  authority: { front_line: 100, manager: 300 }
  high_demand: { utilisation_above: 0.80, block_price_discounts: true, hold_minutes: 30 }
  hold: { default_minutes: 120, evening_enquiry_after: "18:00", evening_enquiry_until: "10:00", never_within_hours_of_session: 3 }
  p_resell_matrix: salt_deal_policy.csv     # placeholder until the venue's own no-sale data exists
  p_book_defaults: { standard: 0.40, fee_concession: 0.50, perk: 0.55, price: 0.55, alternative: 0.35, terms: 0.45, clarify: 0.40 }
  escalation_minutes: 30
  max_alternatives: 2

callbacks:
  default_minutes: 30
  if_session_within_hours: { 4: 10 }

finance:
  pnl: null          # add a monthly P&L snapshot to switch on profit-and-loss adaptation
  bounds: {}

staff:
  - { name: Mei, tier: front_line }
  - { name: Daniel, tier: manager }
  - { name: Owner, tier: owner, on_duty: false }

rollout:
  autosend: { keep_quote: false, offer_approved_concession: false, suggest_alternative: false, escalate: false }
  out_of_hours_autosend_keep_quote: false

channels:
  telegram: { staff_chat_id: null, bot_token_env: TELEGRAM_BOT_TOKEN }

adapters: { conversation: telegram, booking: builtin_calendar, prices: profile }

placeholders:
  - "Unit counts per seat type (8 beds is an estimate)."
  - "Cost ratios and perk costs: 30% COGS, S$55 / S$45 spend cases and S$35 cake are workbook placeholders."
  - "Regular contribution per unit (S$115 per bed on weekend evenings) and the P(resell) matrix are placeholders."
  - "VIP area opportunity cost (~S$302.50) inferred from the spec's VIP row; confirm against the workbook."
  - "Reservations desk hours, cancellation window and paylink URL."
