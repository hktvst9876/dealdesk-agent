# A hair salon: the scarce thing is stylist time.
# Shows: the same group gets a discount on a quiet Tuesday and perks only on a
# full Saturday, because a Saturday hour displaces paying regulars.

business:
  id: studio_north
  name: Studio North
  kind: salon
  currency: SGD
  currency_symbol: "S$"
  timezone: Asia/Singapore
  staffed_hours: { tue_sat: "10:00-20:00", sun: "10:00-17:00" }
  tone: "Warm and polished. Confirm the services, the price and the time, then one next step."
  house_rules:
    cancellation: "Free rescheduling up to 24 hours before; a S$50 fee applies to later cancellations."

inventory:
  - id: stylist_time
    label: stylist time
    kind: hours
    pricing: none
    hours_capacity_per_day: 24          # 3 stylists x 8 hours
    forecast_hours_per_day: { mon: 0, tue: 12, wed: 14, thu: 16, fri: 20, sat: 23, sun: 9 }
    contribution_per_hour: 55
    overtime_premium_per_hour: 30

products:
  - { id: cut_blowdry, aliases: [cut and blow-dry, cut and blowdry, blow-dries, blow-dry, blow dries, blow dry, blowdries, blowdry, cuts], label: "cut and blow-dry", category: service, price: 85, unit_cost: 21, hours: 1.0, resource_id: stylist_time }
  - { id: colour, aliases: [colour, color, colours], label: "colour", category: service, price: 160, unit_cost: 48, hours: 2.0, resource_id: stylist_time }
  - { id: bridal_updo, aliases: [bridal up-do, bridal updo, up-do, updo], label: "bridal up-do", category: service, price: 120, unit_cost: 30, hours: 1.25, resource_id: stylist_time }
  - { id: treatment_mask, aliases: [hair mask, mask], label: "hair mask treatment", category: service, price: 35, unit_cost: 6, hours: 0.25, resource_id: stylist_time }

fees:
  late_cancellation: { amount: 50, per: booking, charged: on_event, label: late cancellation }

economics:
  cogs_pct: 0

perks:
  - id: mask_for_group
    label: Hair mask treatment for each guest
    type: item
    product_id: treatment_mask
    cost_per: guest
    max_per_booking: 8
    approval: { front_line: 6, manager: 8 }
    blockers: [occasion, price]
    p_class: perk
    customer_text: "a hair mask treatment for everyone in the party"
    keywords: [mask, treatment]
  - id: group_15
    label: 15% group discount
    type: price_discount
    discount_pct: 0.15
    scope: bill
    eligibility: { min_guests: 4 }
    approval: front_line
    blockers: [price]
    p_class: price
    customer_text: "15% off for the group"
    keywords: [discount, "% off"]

policy:
  min_contribution: 120
  concession_cap: 150
  authority: { front_line: 120, manager: 300 }

staff:
  - { name: Ava, tier: front_line }
  - { name: Lena, tier: manager }

placeholders:
  - "Illustrative salon; replace menu, costs, capacity and forecasts with real ones."
