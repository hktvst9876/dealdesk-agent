[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dealdesk"
version = "0.1.0"
description = "A financially responsible deal agent for any business: on-the-spot deals inside owner-approved limits, on Telegram."
requires-python = ">=3.11"
dependencies = [
  "anthropic>=2.0",
  "httpx>=0.27",
  "pydantic>=2.6",
  "PyYAML>=6.0",
  "openpyxl>=3.1",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
dealdesk = "dealdesk.cli:main"

[tool.setuptools.packages.find]
include = ["dealdesk*"]
